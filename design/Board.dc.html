<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tracker · Board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4338CA}a:hover{color:#312E81}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #18181B; background: #FFFFFF; min-height: 860px; display: flex; flex-wrap: wrap; font-size: 14px">

<nav aria-label="Main" style="flex: 1 1 220px; background: #F7F7F8; border-right: 1px solid #E6E6EA; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px">
<div aria-hidden="true" style="width: 28px; height: 28px; border-radius: 8px; background: #4F46E5; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">T</div>
<div style="font-weight: 600; font-size: 15px">Tracker</div>
<div style="margin-left: auto; font-size: 12px; color: #5F5F6B">Web Platform</div>
</div>
<a href="Palette.dc.html" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 1px solid #E6E6EA; border-radius: 8px; background: #FFFFFF; color: #5F5F6B; font-size: 13px; text-decoration: none; margin-bottom: 10px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><span>Search or run a command</span><span style="margin-left: auto; font-size: 11px; border: 1px solid #E6E6EA; border-radius: 4px; padding: 1px 5px">⌘K</span></a>
<a href="Main.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 10px; border-radius: 6px; color: #3F3F46; text-decoration: none">Inbox<span style="margin-left: auto; font-size: 12px; color: #5F5F6B">4</span></a>
<a href="Main.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 10px; border-radius: 6px; color: #3F3F46; text-decoration: none">My issues<span style="margin-left: auto; font-size: 12px; color: #5F5F6B">23</span></a>
<a href="Main.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 10px; border-radius: 6px; color: #3F3F46; text-decoration: none">All issues</a>
<a href="Board.dc.html" aria-current="page" style="display: flex; align-items: center; height: 36px; padding: 0 10px; border-radius: 6px; background: #E9E9F2; color: #18181B; font-weight: 500; text-decoration: none">Board</a>
<a href="Settings.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 10px; border-radius: 6px; color: #3F3F46; text-decoration: none">Settings</a>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px 0; border-top: 1px solid #E6E6EA">
<div aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; background: #4F46E5; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">AK</div>
<div style="display: flex; flex-direction: column"><span style="font-weight: 500; font-size: 13px">Alex Kim</span><span style="font-size: 12px; color: #15803D">● Online</span></div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 20px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; background: #FAFAFB">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<h1 style="margin: 0; font-size: 20px; font-weight: 600">Board</h1>
<span style="padding: 4px 10px; background: #EEF0FF; color: #312E81; border-radius: 14px; font-size: 12px">Assignee is Alex Kim</span>
<div style="margin-left: auto; display: flex; gap: 8px; align-items: center">
<div role="group" aria-label="View" style="display: flex; border: 1px solid #E6E6EA; border-radius: 8px; overflow: hidden; background: #FFFFFF">
<a href="Main.dc.html" style="padding: 8px 14px; color: #3F3F46; text-decoration: none; font-size: 13px">List</a>
<a href="Board.dc.html" aria-current="page" style="padding: 8px 14px; background: #F1F1F6; color: #18181B; font-weight: 500; text-decoration: none; font-size: 13px">Board</a>
</div>
<a href="Create.dc.html" style="padding: 9px 14px; background: #4F46E5; color: #FFFFFF; border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 13px">+ New issue</a>
</div>
</header>

<div style="overflow-x: auto; padding-bottom: 8px">
<div style="display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 14px; min-width: 920px; align-items: start">
<sc-for list="{{columns}}" as="col" hint-placeholder-count="4">
<section aria-label="{{col.name}}" style="background: #F1F1F4; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 560px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 8px; padding: 4px 4px 6px">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{col.dot}}"></span>
<h2 style="margin: 0; font-size: 13px; font-weight: 600">{{col.name}}</h2>
<span style="font-size: 12px; color: #5F5F6B">{{col.count}}</span>
<button type="button" aria-label="Collapse column" style="margin-left: auto; width: 28px; height: 28px; border: 0; background: transparent; color: #5F5F6B; border-radius: 6px; cursor: pointer">–</button>
</div>
<sc-if value="{{col.over}}" hint-placeholder-val="{{ false }}">
<div style="font-size: 12px; color: #9A3412; background: #FFEDD5; border-radius: 6px; padding: 6px 8px">Over WIP limit (6 / 5)</div>
</sc-if>
<sc-for list="{{col.cards}}" as="card" hint-placeholder-count="3">
<sc-if value="{{card.isPlaceholder}}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="height: 86px; border: 2px dashed #818CF8; border-radius: 10px; background: #EEF0FF"></div>
</sc-if>
<sc-if value="{{card.isCard}}" hint-placeholder-val="{{ true }}">
<a href="Detail.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 12px; background: #FFFFFF; border: 1px solid #E6E6EA; border-radius: 10px; text-decoration: none; color: #18181B; transform: {{card.transform}}; box-shadow: {{card.shadow}}; opacity: {{card.opacity}}">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5F5F6B"><span>{{card.id}}</span><span style="margin-left: auto; color: {{card.prioColor}}; font-weight: 500">{{card.prio}}</span></div>
<span style="font-size: 13px; font-weight: 500; line-height: 1.4">{{card.title}}</span>
<div style="display: flex; align-items: center; gap: 6px"><span style="padding: 2px 8px; border-radius: 10px; background: #F1F1F4; color: #3F3F46; font-size: 11px">{{card.label}}</span><span aria-hidden="true" style="margin-left: auto; width: 22px; height: 22px; border-radius: 50%; background: {{card.avatarBg}}; color: #FFFFFF; font-size: 9px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{card.initials}}</span></div>
</a>
</sc-if>
</sc-for>
<button type="button" style="height: 36px; border: 0; background: transparent; color: #5F5F6B; text-align: left; padding: 0 8px; font: inherit; font-size: 13px; border-radius: 6px; cursor: pointer">+ Add issue</button>
</section>
</sc-for>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    var colors = { AK: '#4F46E5', MR: '#0F766E', JL: '#B45309', SP: '#BE185D' };
    function c(id, prio, title, label, who, extra) {
      var o = { isCard: true, isPlaceholder: false, id: id, prio: prio, title: title, label: label, initials: who, avatarBg: colors[who],
        prioColor: prio === 'Urgent' ? '#C2410C' : '#5F5F6B', transform: 'none', shadow: 'none', opacity: '1' };
      if (extra === 'drag') { o.transform = 'rotate(-2deg) translate(18px, -6px)'; o.shadow = '0 14px 30px rgba(24,24,27,0.22)'; }
      return o;
    }
    var ph = { isCard: false, isPlaceholder: true };
    return {
      columns: [
        { name: 'Todo', dot: '#71717A', count: 3, over: false, cards: [
          c('ISS-1037', 'High', 'WebSocket handler shows stale assignee names', 'realtime', 'AK'),
          c('ISS-0998', 'Medium', 'Offline queue loses edits on reload', 'bug', 'AK'),
          c('ISS-1028', 'Medium', 'Undo does not restore label order', 'bug', 'AK')
        ] },
        { name: 'In Progress', dot: '#D97706', count: 6, over: true, cards: [
          c('ISS-1042', 'Urgent', 'Search input lags when typing with 10k issues loaded', 'perf', 'AK'),
          c('ISS-1031', 'Medium', 'Keyboard navigation for the command palette', 'a11y', 'AK', 'drag'),
          c('ISS-1016', 'High', 'IssueRow re-renders on every socket message', 'perf', 'AK')
        ] },
        { name: 'In Review', dot: '#4F46E5', count: 2, over: false, cards: [
          c('ISS-1039', 'High', 'Card drops into the wrong column after a filter change', 'bug', 'AK'),
          ph,
          c('ISS-1008', 'Medium', 'Error boundary around the comments panel', 'feature', 'AK')
        ] },
        { name: 'Done', dot: '#16A34A', count: 14, over: false, cards: [
          c('ISS-1019', 'Medium', 'Roll back optimistic status change on a 500', 'realtime', 'AK'),
          c('ISS-1011', 'Low', 'Persist filters to the URL', 'feature', 'AK')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
