<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tracker · Command palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4338CA}a:hover{color:#312E81}
.typed::placeholder{color:#18181B}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #18181B; background: #FFFFFF; min-height: 860px; position: relative; font-size: 14px; overflow: hidden">

<div aria-hidden="true" style="display: flex; flex-wrap: wrap; min-height: 860px">
<div style="flex: 1 1 220px; background: #F7F7F8; border-right: 1px solid #E6E6EA; padding: 20px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<div style="height: 24px; width: 120px; background: #E4E4EA; border-radius: 6px"></div>
<div style="height: 32px; background: #ECECF1; border-radius: 8px"></div>
<div style="height: 14px; width: 70%; background: #ECECF1; border-radius: 4px"></div>
<div style="height: 14px; width: 60%; background: #ECECF1; border-radius: 4px"></div>
<div style="height: 14px; width: 75%; background: #E4E4EA; border-radius: 4px"></div>
</div>
<div style="flex: 999 1 560px; min-width: 0; padding: 24px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<div style="height: 26px; width: 180px; background: #ECECF1; border-radius: 6px"></div>
<div style="height: 34px; width: 60%; background: #F3F3F6; border-radius: 8px"></div>
<div style="height: 36px; background: #F3F3F6; border-radius: 6px"></div>
<div style="height: 36px; background: #EEF0FF; border-radius: 6px"></div>
<div style="height: 36px; background: #F3F3F6; border-radius: 6px"></div>
<div style="height: 36px; background: #F7F7F9; border-radius: 6px"></div>
<div style="height: 36px; background: #F3F3F6; border-radius: 6px"></div>
</div>
</div>

<div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(24,24,27,0.4); display: flex; align-items: flex-start; justify-content: center; padding: 96px 16px; box-sizing: border-box">
<div role="dialog" aria-modal="true" aria-label="Command palette" style="width: 100%; max-width: 620px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.28); overflow: hidden">
<div style="padding: 10px 16px 0; display: flex; gap: 6px">
<span style="padding: 3px 8px; background: #EEF0FF; color: #312E81; border-radius: 6px; font-size: 12px">ISS-1031 · Keyboard navigation for the command palette</span>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 16px 12px; border-bottom: 1px solid #EFEFF2">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F5F6B" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<label for="cmd" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Type a command or search</label>
<input id="cmd" class="typed" role="combobox" aria-expanded="true" aria-controls="cmd-list" aria-activedescendant="opt-1" placeholder="move to" style="flex: 1; height: 36px; border: 0; outline: none; font: inherit; font-size: 16px">
<span style="font-size: 11px; color: #5F5F6B; border: 1px solid #E6E6EA; border-radius: 4px; padding: 2px 6px">Esc</span>
</div>

<ul id="cmd-list" role="listbox" style="list-style: none; margin: 0; padding: 8px; display: flex; flex-direction: column; gap: 2px; max-height: 420px; overflow: auto">
<li role="presentation" style="padding: 8px 10px 4px; font-size: 12px; font-weight: 600; color: #5F5F6B">Actions</li>
<sc-for list="{{actions}}" as="a" hint-placeholder-count="4">
<li id="{{a.domId}}" role="option" aria-selected="{{a.selected}}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 8px; background: {{a.bg}}; color: #18181B">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{a.dot}}"></span>
<span>{{a.label}}</span>
<span style="margin-left: auto; font-size: 12px; color: #5F5F6B">{{a.hint}}</span>
</li>
</sc-for>
<li role="presentation" style="padding: 12px 10px 4px; font-size: 12px; font-weight: 600; color: #5F5F6B">Issues</li>
<sc-for list="{{issues}}" as="i" hint-placeholder-count="2">
<li role="option" aria-selected="false" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 8px">
<span style="font-size: 12px; color: #5F5F6B; width: 64px">{{i.id}}</span>
<span>{{i.title}}</span>
</li>
</sc-for>
</ul>

<div style="display: flex; flex-wrap: wrap; gap: 16px; padding: 10px 16px; border-top: 1px solid #EFEFF2; background: #FAFAFB; font-size: 12px; color: #5F5F6B">
<span>↑ ↓ to move</span><span>Enter to run</span><span>Tab to filter by type</span><span style="margin-left: auto">5 results · ranked in 2 ms</span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    var acts = [
      ['Move to Todo', '#71717A', ''],
      ['Move to In Progress', '#D97706', 'Recent'],
      ['Move to In Review', '#4F46E5', 'Current status'],
      ['Move to Done', '#16A34A', '']
    ];
    return {
      actions: acts.map(function (a, i) {
        return { domId: 'opt-' + i, label: a[0], dot: a[1], hint: a[2], selected: i === 1 ? 'true' : 'false', bg: i === 1 ? '#EEF0FF' : 'transparent' };
      }),
      issues: [
        { id: 'ISS-0987', title: 'Move toast notifications to a portal' },
        { id: 'ISS-0954', title: 'Move filters into the URL search params' }
      ]
    };
  }
}
</script>
</body>
</html>
